<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>IBONARIUM // ECOLOGY PRO RADAR</title>

    <!-- Meta -->
    <meta name="description"
        content="Глобальний центр екологічного моніторингу в реальному часі. Сейсмічна активність, пожежі, якість повітря.">
    <meta name="theme-color" content="#05070a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- External Resources -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="ecology_style.css">
</head>

<body>
    <div class="scanline"></div>

    <div id="map"></div>

    <div class="ui-container">
        <!-- Sidebar Left: All Controls & Info -->
        <header class="panel">
            <div class="logo-block">
                <h1>Ibonarium <span class="version">v3.0 PRO</span></h1>
                <div class="subtitle">ADVANCED ECOLOGICAL ANALYTICS</div>
            </div>

            <div class="controls-panel">
                <div class="control-group-title">МОНІТОРИНГ</div>

                <div class="layers-grid">
                    <button class="toggle-btn active" id="btn-quakes" onclick="toggleLayer('quakes')">
                        <i data-lucide="activity" style="color: var(--accent-red);"></i>
                        <span>Землетруси</span>
                        <div class="indicator"></div>
                    </button>

                    <button class="toggle-btn" id="btn-fires" onclick="toggleLayer('fires')">
                        <i data-lucide="flame" style="color: var(--accent-orange);"></i>
                        <span>Пожежі</span>
                        <div class="indicator"></div>
                    </button>

                    <button class="toggle-btn" id="btn-air" onclick="toggleLayer('air')">
                        <i data-lucide="wind" style="color: var(--accent-cyan);"></i>
                        <span>Повітря</span>
                        <div class="indicator"></div>
                    </button>

                    <button class="toggle-btn" id="btn-rad" onclick="toggleLayer('rad')">
                        <i data-lucide="radio" style="color: var(--accent-green);"></i>
                        <span>Радіація</span>
                        <div class="indicator"></div>
                    </button>

                    <button class="toggle-btn" id="btn-anom" onclick="toggleLayer('anom')">
                        <i data-lucide="alert-triangle" style="color: #fff;"></i>
                        <span>Аномалії</span>
                        <div class="indicator"></div>
                    </button>

                    <button class="toggle-btn" id="btn-ozone" onclick="toggleLayer('ozone')">
                        <i data-lucide="shield" style="color: #00ccff;"></i>
                        <span>Озон</span>
                        <div class="indicator"></div>
                    </button>

                    <button class="toggle-btn" id="btn-wind" onclick="toggleLayer('wind')">
                        <i data-lucide="navigation" style="color: #66ccff;"></i>
                        <span>Вітер</span>
                        <div class="indicator"></div>
                    </button>
                </div>

                <div class="control-group-title">АНАЛІТИКА</div>
                <div class="chart-container">
                    <canvas id="quakeChart"></canvas>
                </div>

                <div class="threat-box">
                    <div class="threat-header">
                        <span>ЗАГРОЗА: <b style="color:var(--accent-red)" id="danger-status">ELEVATED</b></span>
                        <span id="danger-value">4.2</span>
                    </div>
                    <div class="progress-bar">
                        <div id="danger-progress"></div>
                    </div>
                </div>
            </div>

            <div class="system-info-compact">
                <div class="coord-display">
                    <span id="lat">00.00</span> | <span id="lon">00.00</span>
                </div>
                <div class="status-row">
                    <span>МЕРЕЖА: <b id="net-status" style="color:var(--accent-green)">OK</b></span>
                    <span>ОНОВ: <b id="last-update">..:..</b></span>
                </div>
                <div class="status-msg" id="status-detailed">Система готова</div>
            </div>
        </header>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="ecology_script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
